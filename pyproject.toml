[project]
name = "shopify-meli-orders"
version = "0.1.0"
description = "Buy paid Shopify orders on Mercado Libre with the customer as recipient, then fulfil them in Shopify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned: the whole purchase flow is browser automation through it.
    "playwright==1.61.0",
    "jsonschema>=4.23,<5",
]

[project.scripts]
meli-orders = "meli_orders.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meli_orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
